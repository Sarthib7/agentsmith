name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test architecture viewer and Anatomy model
        run: node --test site/architecture-viewer.test.mjs site/anatomy/model.test.mjs

      - name: Build and audit dark and light Anatomy views
        run: |
          node site/anatomy/build.mjs --audit
          node site/anatomy/build.mjs --light --audit

      - name: Check generated Anatomy views
        run: git diff --exit-code -- site/anatomy/workbench.html site/anatomy/workbench-light.html

      - name: Validate collection
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B scripts/build-index.py
          git diff --exit-code -- SKILLS.md skills.sh.json README.md

      - name: Build catalog site
        run: python3 -B scripts/build-site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
