name: Validate catalog and site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test architecture viewer and Anatomy model
        run: node --test site/architecture-viewer.test.mjs site/anatomy/model.test.mjs

      - name: Build and audit dark and light Anatomy views
        run: |
          node site/anatomy/build.mjs --audit
          node site/anatomy/build.mjs --light --audit

      - name: Check generated Anatomy views
        run: git diff --exit-code -- site/anatomy/workbench.html site/anatomy/workbench-light.html

      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Build catalog
        run: python3 -B scripts/build-index.py

      - name: Build site
        run: python3 -B scripts/build-site.py

      - name: Check generated files
        run: git diff --exit-code -- SKILLS.md skills.sh.json README.md

      - name: Check whitespace
        run: git diff --check
