<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f7f6f2">
  <title id="title">Configuration, guidance, and task dispatch</title>
  <desc id="desc">Eight concepts separate public guidance from OMP runtime model selection. Rules and task-matched skills inform the orchestration guide; that guide is policy, not runtime enforcement. The lead session sends a selector request through the pinned OMP model resolver to structured task dispatch. Three advisor labels are optional roles; main-session-only is policy. Enabled state and provider access are unknown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#64665e"/></marker><marker id="policy-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#c2381c"/></marker></defs>
  <text x="20" y="32" fill="#64665e" font-size="16" font-weight="700" letter-spacing="1">GUIDANCE LAYER</text>
  <text x="20" y="286" fill="#64665e" font-size="16" font-weight="700" letter-spacing="1">RUNTIME SELECTION PATH</text>
  <g fill="none" stroke="#c2381c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#policy-arrow)">
    <path d="M220 112H260"/>
    <path d="M500 112H460"/>
    <path d="M360 165V230H840V320"/>
  </g>
  <g fill="none" stroke="#64665e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 372H260"/>
    <path d="M460 372H500"/>
    <path d="M700 372H740"/>
  </g>
  <text x="600" y="219" text-anchor="middle" fill="#a33219" font-size="16" font-weight="650">policy guidance · not a runtime gate</text>
  <g>
    <rect x="20" y="65" width="200" height="100" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="120" y="99" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Rules + examples</text>
    <text x="120" y="129" text-anchor="middle" fill="#64665e" font-size="16">always-on policy</text>
    <text x="120" y="152" text-anchor="middle" fill="#64665e" font-size="16">adaptable settings</text>
    <rect x="260" y="65" width="200" height="100" rx="8" fill="#fff0e8" stroke="#c2381c" stroke-width="2"/>
    <text x="360" y="99" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Orchestration guide</text>
    <text x="360" y="129" text-anchor="middle" fill="#64665e" font-size="16">bounded slices · owners</text>
    <text x="360" y="152" text-anchor="middle" fill="#64665e" font-size="16">parent verification</text>
    <rect x="500" y="65" width="200" height="100" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="600" y="99" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Task-matched skill</text>
    <text x="600" y="129" text-anchor="middle" fill="#64665e" font-size="16">task-specific guidance</text>
    <text x="600" y="152" text-anchor="middle" fill="#64665e" font-size="16">not model authorization</text>
    <rect x="740" y="65" width="200" height="100" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="840" y="99" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Advisor roles</text>
    <text x="840" y="129" text-anchor="middle" fill="#64665e" font-size="16">Astra · Fable · Grok</text>
    <text x="840" y="152" text-anchor="middle" fill="#64665e" font-size="16">optional · main only</text>
    <rect x="20" y="320" width="200" height="105" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="120" y="356" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Lead session</text>
    <text x="120" y="386" text-anchor="middle" fill="#64665e" font-size="16">request owner</text>
    <text x="120" y="410" text-anchor="middle" fill="#64665e" font-size="16">guidance assembled</text>
    <rect x="260" y="320" width="200" height="105" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="360" y="356" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Request + selectors</text>
    <text x="360" y="386" text-anchor="middle" fill="#64665e" font-size="16">local config not shown</text>
    <text x="360" y="410" text-anchor="middle" fill="#64665e" font-size="16">request pattern</text>
    <rect x="500" y="320" width="200" height="105" rx="8" fill="#fffefa" stroke="#20211e" stroke-width="2"/>
    <text x="600" y="356" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">OMP model resolver</text>
    <text x="600" y="386" text-anchor="middle" fill="#64665e" font-size="16">pattern + inheritance</text>
    <text x="600" y="410" text-anchor="middle" fill="#64665e" font-size="16">selection only</text>
    <rect x="740" y="320" width="200" height="105" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="840" y="356" text-anchor="middle" fill="#20211e" font-size="18" font-weight="700">Task dispatch</text>
    <text x="840" y="386" text-anchor="middle" fill="#64665e" font-size="16">ordinary / optional</text>
    <text x="840" y="410" text-anchor="middle" fill="#64665e" font-size="16">route</text>
  </g>
  <text x="480" y="489" text-anchor="middle" fill="#64665e" font-size="16">Optional roles · enabled state unknown · labels do not identify providers · no selector values shown</text>
</svg>