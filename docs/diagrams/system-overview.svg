    <rect x="225" y="205" width="175" height="88" rx="8" fill="#fff0e8" stroke="#c2381c" stroke-width="2"/>
    <text x="312" y="241" text-anchor="middle" fill="#20211e" font-size="19" font-weight="700">Lead session</text>
    <text x="312" y="269" text-anchor="middle" fill="#64665e" font-size="16">plan · contracts</text>
    <rect x="465" y="205" width="190" height="88" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="560" y="241" text-anchor="middle" fill="#20211e" font-size="19" font-weight="700">Logical task farm</text>
