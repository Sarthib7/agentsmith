<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc" style="font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f7f6f2">
  <title id="title">Agentsmith system overview</title>
  <desc id="desc">Eight concepts: a human request reaches the lead session; three optional advisor roles relate to the main session by policy; the lead delegates to a logical bounded task farm; repository artifacts return for parent-owned verification. Enabled state and session bindings are unknown. This is policy and static source context, not live telemetry or a process-isolation claim.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#64665e"/></marker></defs>
  <text x="480" y="31" text-anchor="middle" fill="#64665e" font-size="16" font-weight="650" letter-spacing="1">OPTIONAL ADVISOR ROLES · MAIN SESSION ONLY</text>
  <g fill="none" stroke="#64665e" stroke-width="2">
    <path d="M315 138V165 M540 138V165 M765 138V165 M315 165H765 M312 165V205" stroke-dasharray="7 6"/>
    <path d="M170 249H225" marker-end="url(#arrow)"/>
    <path d="M400 249H465" marker-end="url(#arrow)"/>
    <path d="M655 249H700" marker-end="url(#arrow)"/>
    <path d="M815 293V345" marker-end="url(#arrow)"/>
    <path d="M700 386H630V435H312V293" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
  </g>
  <text x="465" y="424" text-anchor="middle" fill="#64665e" font-size="16" font-weight="650">PARENT-OWNED CHECK OF THE MERGED STATE</text>
  <g>
