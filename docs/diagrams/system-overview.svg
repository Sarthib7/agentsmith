    <rect x="655" y="55" width="220" height="83" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="765" y="88" text-anchor="middle" fill="#20211e" font-size="19" font-weight="700">Grok</text>
    <text x="765" y="116" text-anchor="middle" fill="#64665e" font-size="16">optional role</text>
