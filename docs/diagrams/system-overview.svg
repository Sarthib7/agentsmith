    <rect x="430" y="55" width="220" height="83" rx="8" fill="#fffefa" stroke="#dcded4" stroke-width="2"/>
    <text x="540" y="88" text-anchor="middle" fill="#20211e" font-size="19" font-weight="700">Fable</text>
