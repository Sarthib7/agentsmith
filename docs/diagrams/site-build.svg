<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" style="font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f7f6f2">
  <title id="title">Canonical documentation to Pages build path</title>
  <desc id="desc">Seven concepts show the canonical guide and six SVGs, six page templates and application assets, catalog data, and the Pages trigger. The build pipeline defines a Node illustration build before Python site assembly. The output contains pages, standalone figures, diagrams and the graph viewer. The workflow uploads _site and invokes deploy-pages after a main push or manual dispatch. This diagram is a source map, not live build or deployment telemetry.</desc>
