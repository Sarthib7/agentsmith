<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Smith Flow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.3.6/dist/style.css" />
    <style>
      :root {
        --bg-1: #050816;
        --bg-2: #0b1220;
        --text: #eef2ff;
        --muted: #94a3b8;
        --line: #334155;
        --card-blue: linear-gradient(160deg, #2563eb, #1d4ed8);
        --card-violet: linear-gradient(160deg, #7c3aed, #5b21b6);
        --card-teal: linear-gradient(160deg, #06b6d4, #0e7490);
        --card-green: linear-gradient(160deg, #10b981, #047857);
        --card-orange: linear-gradient(160deg, #f59e0b, #b45309);
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .topbar {
        position: absolute;
        z-index: 20;
        left: 14px;
        top: 14px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(2, 6, 23, 0.8);
        backdrop-filter: blur(4px);
      }

      .topbar h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
      }

      .topbar p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .flow-node {
        border-radius: 10px;
        border: 1px solid var(--line);
        color: var(--text);
        width: 260px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        padding: 10px 11px;
      }

      .flow-node h4 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      .flow-node ul {
        margin: 0;
        padding-left: 16px;
        font-size: 11px;
        line-height: 1.3;
      }

      .flow-node li {
        margin-bottom: 2px;
      }

      .node-start {
        background: var(--card-blue);
        border-color: #60a5fa;
      }

      .node-policy {
        background: var(--card-teal);
        border-color: #67e8f9;
      }

      .node-decision {
        background: var(--card-violet);
        border-color: #a78bfa;
      }

      .node-action {
        background: var(--card-green);
        border-color: #86efac;
      }

      .node-final {
        background: var(--card-orange);
        border-color: #fbbf24;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #e2e8f0;
        font-size: 14px;
        padding: 20px;
        text-align: center;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="fallback">Loading Agent Smith flow...</div>
    </div>

    <script type="module">
      import React from 'https://esm.sh/react@18.2.0?bundle';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?bundle';
      import { ReactFlow, Background, Controls, MiniMap, Panel } from 'https://esm.sh/@xyflow/react@12.11.3?bundle';

      const StepNode = ({ data }) => {
        const { title, points = [], theme = 'start' } = data;
        const cls = `flow-node node-${theme}`;

        return React.createElement(
          'div',
          { className: cls },
          React.createElement('h4', null, title),
          React.createElement(
            'ul',
            null,
            points.map((point, index) => React.createElement('li', { key: index }, point)),
          ),
        );
      };

      const nodes = [
        {
          id: 'user-input',
          type: 'stage',
          position: { x: 640, y: 20 },
          data: {
            title: 'User input enters',
            theme: 'start',
            points: ['Parser reads request text', 'Session intent and constraints are extracted'],
          },
        },
        {
          id: 'normalize',
          type: 'stage',
          position: { x: 640, y: 120 },
          data: {
            title: 'Normalize request',
            theme: 'start',
            points: ['Normalize language and typos', 'Build action scope'],
          },
        },
        {
          id: 'agents-md',
          type: 'stage',
          position: { x: 220, y: 250 },
          data: {
            title: 'Load agents.md',
            theme: 'policy',
            points: ['Read top-level agent instructions', 'Apply global behavior flags'],
          },
        },
        {
          id: 'rules-agents',
          type: 'stage',
          position: { x: 500, y: 250 },
          data: {
            title: 'Load rules/AGENTS.md',
            theme: 'policy',
            points: ['Load always-on operational constraints', 'Apply coding and safety constraints'],
          },
        },
        {
          id: 'rules-claude',
          type: 'stage',
          position: { x: 780, y: 250 },
          data: {
            title: 'Load rules/CLAUDE.md',
            theme: 'policy',
            points: ['Load harness-specific policy copy', 'Keep outputs in required shape'],
          },
        },
        {
          id: 'notes-artifacts',
          type: 'stage',
          position: { x: 1060, y: 250 },
          data: {
            title: 'Notes artifacts check',
            theme: 'policy',
            points: ['Use notes if request references prior context', 'Otherwise skip this branch'],
          },
        },
        {
          id: 'context-loaded',
          type: 'stage',
          position: { x: 640, y: 360 },
          data: {
            title: 'Instruction stack ready',
            theme: 'action',
            points: ['All instruction layers ready', 'Route decision for workflow path'],
          },
        },
        {
          id: 'route-decision',
          type: 'stage',
          position: { x: 640, y: 470 },
          data: {
            title: 'Execution route decision',
            theme: 'decision',
            points: ['Skill explicitly asked?', 'Can proceed with direct execution?'],
          },
        },
        {
          id: 'skill-match',
          type: 'stage',
          position: { x: 260, y: 590 },
          data: {
            title: 'Match skill from SKILLS.md',
            theme: 'action',
            points: ['Find exact skill', 'Load skill contract and boundaries'],
          },
        },
        {
          id: 'skill-load',
          type: 'stage',
          position: { x: 260, y: 700 },
          data: {
            title: 'Read SKILL.md',
            theme: 'action',
            points: ['Apply declared steps', 'Load references and templates'],
          },
        },
        {
          id: 'skill-constraints',
          type: 'stage',
          position: { x: 260, y: 810 },
          data: {
            title: 'Skill constraints gate',
            theme: 'decision',
            points: ['Need explicit invocation?', 'Any destructive confirmation requirement?'],
          },
        },
        {
          id: 'user-approve-skill',
          type: 'stage',
          position: { x: 40, y: 950 },
          data: {
            title: 'Ask user for required action',
            theme: 'final',
            points: ['If skill blocked by policy, pause', 'Ask for confirmation message'],
          },
        },
        {
          id: 'run-skill',
          type: 'stage',
          position: { x: 260, y: 1070 },
          data: {
            title: 'Run skill workflow',
            theme: 'action',
            points: ['Execute workflow in sequence', 'Use gated tools and approvals'],
          },
        },
        {
          id: 'direct-route',
          type: 'stage',
          position: { x: 1000, y: 590 },
          data: {
            title: 'Direct execution route',
            theme: 'action',
            points: ['No skill match', 'Use direct execution engine'],
          },
        },
        {
          id: 'direct-plan',
          type: 'stage',
          position: { x: 1000, y: 700 },
          data: {
            title: 'Build minimal slice',
            theme: 'action',
            points: ['Pick smallest fix', 'Read only required files'],
          },
        },
        {
          id: 'direct-edit',
          type: 'stage',
          position: { x: 1000, y: 810 },
          data: {
            title: 'Edit and patch',
            theme: 'action',
            points: ['Apply minimal diff', 'Keep requested scope'],
          },
        },
        {
          id: 'direct-check',
          type: 'stage',
          position: { x: 1000, y: 920 },
          data: {
            title: 'Exit checks',
            theme: 'action',
            points: ['Respect confirmation gates', 'Skip unsolicited validation'],
          },
        },
        {
          id: 'handoff',
          type: 'stage',
          position: { x: 640, y: 1220 },
          data: {
            title: 'Response assembly',
            theme: 'action',
            points: ['Compose outcome summary', 'List changed and unchanged files'],
          },
        },
        {
          id: 'final-response',
          type: 'stage',
          position: { x: 640, y: 1320 },
          data: {
            title: 'Reply to user',
            theme: 'final',
            points: ['Return result and constraints', 'Offer one clear next action'],
          },
        },
        {
          id: 'iterate',
          type: 'stage',
          position: { x: 640, y: 1430 },
          data: {
            title: 'Next request loop',
            theme: 'final',
            points: ['New turn resets pipeline', 'Keep memory updates from prior step'],
          },
        },
      ];

      const edges = [
        { id: 'e1', source: 'user-input', target: 'normalize', type: 'smoothstep' },
        { id: 'e2', source: 'normalize', target: 'agents-md', type: 'smoothstep' },
        { id: 'e3', source: 'normalize', target: 'rules-agents', type: 'smoothstep' },
        { id: 'e4', source: 'normalize', target: 'rules-claude', type: 'smoothstep' },
        { id: 'e5', source: 'normalize', target: 'notes-artifacts', type: 'smoothstep' },
        { id: 'e6', source: 'agents-md', target: 'context-loaded', type: 'smoothstep' },
        { id: 'e7', source: 'rules-agents', target: 'context-loaded', type: 'smoothstep' },
        { id: 'e8', source: 'rules-claude', target: 'context-loaded', type: 'smoothstep' },
        { id: 'e9', source: 'notes-artifacts', target: 'context-loaded', type: 'smoothstep' },
        { id: 'e10', source: 'context-loaded', target: 'route-decision', type: 'smoothstep' },
        {
          id: 'e11',
          source: 'route-decision',
          target: 'skill-match',
          label: 'Skill requested',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        {
          id: 'e12',
          source: 'route-decision',
          target: 'direct-route',
          label: 'No skill path',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        { id: 'e13', source: 'skill-match', target: 'skill-load', type: 'smoothstep' },
        { id: 'e14', source: 'skill-load', target: 'skill-constraints', type: 'smoothstep' },
        {
          id: 'e15',
          source: 'skill-constraints',
          target: 'run-skill',
          label: 'Auto-runnable',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        {
          id: 'e16',
          source: 'skill-constraints',
          target: 'user-approve-skill',
          label: 'Needs user action',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        { id: 'e17', source: 'user-approve-skill', target: 'route-decision', type: 'smoothstep' },
        {
          id: 'e18',
          source: 'run-skill',
          target: 'handoff',
          label: 'Skill done',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        { id: 'e19', source: 'direct-route', target: 'direct-plan', type: 'smoothstep' },
        { id: 'e20', source: 'direct-plan', target: 'direct-edit', type: 'smoothstep' },
        {
          id: 'e21',
          source: 'direct-edit',
          target: 'direct-check',
          label: 'Direct task done',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        {
          id: 'e22',
          source: 'direct-check',
          target: 'handoff',
          label: 'Checks done',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
        { id: 'e23', source: 'handoff', target: 'final-response', type: 'smoothstep' },
        { id: 'e24', source: 'final-response', target: 'iterate', type: 'smoothstep' },
        {
          id: 'e25',
          source: 'iterate',
          target: 'user-input',
          label: 'Next request',
          type: 'smoothstep',
          labelStyle: { fill: '#f8fafc', fontSize: 10 },
        },
      ];

      const nodeTypes = {
        stage: StepNode,
      };

      const App = () =>
        React.createElement(
          React.Fragment,
          null,
          React.createElement(
            'div',
            { className: 'topbar' },
            React.createElement('h1', null, 'Agent Smith execution flow'),
            React.createElement(
              'p',
              null,
              'Full step-by-step pipeline with instruction layers, skill routing, and completion loop.',
            ),
          ),
          React.createElement(
            ReactFlow,
            {
              nodes,
              edges,
              nodeTypes,
              fitView: true,
              fitViewOptions: { padding: 0.15 },
              minZoom: 0.22,
              maxZoom: 1.8,
              panOnScroll: true,
              zoomOnScroll: true,
              nodesDraggable: false,
              nodesConnectable: false,
              elementsSelectable: false,
              proOptions: { hideAttribution: true },
              style: { width: '100%', height: '100%' },
            },
            React.createElement(Controls, null),
            React.createElement(Background, {
              variant: 'dots',
              gap: 15,
              color: '#334155',
              size: 1,
            }),
            React.createElement(
              MiniMap,
              {
                pannable: true,
                zoomable: true,
                nodeStrokeColor: '#93c5fd',
                nodeColor: '#1e40af',
                maskColor: 'rgba(2, 6, 23, 0.44)',
              },
            ),
            React.createElement(
              Panel,
              { position: 'bottom-right' },
              React.createElement(
                'div',
                { className: 'flow-node node-final', style: { width: 340 } },
                React.createElement('h4', null, 'Legend'),
                React.createElement(
                  'ul',
                  null,
                  React.createElement('li', null, 'Blue: policy and instruction layers'),
                  React.createElement('li', null, 'Purple: decision points'),
                  React.createElement('li', null, 'Green: execution steps'),
                  React.createElement('li', null, 'Orange: closure and response states'),
                ),
              ),
            ),
          ),
        );

      const escapeHtml = (value) =>
        String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');

      const rootNode = document.getElementById('root');
      if (!rootNode) {
        throw new Error('Missing #root container');
      }

      try {
        const root = createRoot(rootNode);
        root.render(React.createElement(App));
      } catch (error) {
        console.error('Failed to boot Agent Smith flow', error);

        rootNode.innerHTML = `
          <div class="fallback">
            <div>
              <strong>Could not boot Agent Smith flow.</strong><br />
              The page loaded, but React Flow failed at runtime.
              <br />
              ${escapeHtml(error && error.message ? error.message : String(error))}
            </div>
          </div>
        `;
      }
    </script>
  </body>
</html>
